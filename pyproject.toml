[project]
name = "matlog-api"
version = "0.1.0"
description = "API para registrar las técnicas enseñadas en las clases de BJJ"
requires-python = ">=3.12"
# Solo lo que usa la app: el extra fastapi[standard] añadía ~30 paquetes (CLI de
# FastAPI Cloud, exportadores de OpenTelemetry...) que no hacen falta en producción.
dependencies = [
    # >=0.142 por la opción telemetry de FastAPI() (ver app/main.py).
    "fastapi>=0.142",
    "uvicorn[standard]>=0.30",
    "email-validator>=2.0",  # EmailStr
    "python-multipart>=0.0.18",  # formulario de login (OAuth2PasswordRequestForm)
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # TestClient
    "fastapi-cli>=0.0.5",  # fastapi dev
]

[tool.pytest.ini_options]
testpaths = ["tests"]
